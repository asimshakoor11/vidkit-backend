# Render Blueprint for the VidKit API (Dashboard -> New -> Blueprint).
# Secrets marked `sync: false` are prompted for when the Blueprint is first applied.
#
# Free plan: 512 MB RAM, shared CPU, sleeps after 15 min idle (~1 min cold start).
# Limits below are sized for that. On a paid plan or another host, raise them and
# build with INSTALL_DEMUCS=true to enable the vocal remover.
services:
  - type: web
    name: vidkit-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon            # keep it close to your Neon region
    numInstances: 1           # must stay 1: jobs and files live in this one instance
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false           # Neon connection string
      - key: CORS_ORIGINS
        sync: false           # e.g. https://vidkit.vercel.app
      - key: PUBLIC_BASE_URL
        sync: false           # e.g. https://vidkit-api.onrender.com
      - key: STORAGE_DIR
        value: /app/storage
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: MAX_VIDEO_DURATION_MIN
        value: "15"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: FILE_TTL_MINUTES
        value: "30"
      - key: RATE_LIMIT_INFO
        value: 10/minute
      - key: RATE_LIMIT_JOBS
        value: 5/hour

